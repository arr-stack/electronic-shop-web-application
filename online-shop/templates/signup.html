<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body style="background: #c8d3fc;
background: linear-gradient(135deg, #c8d3fc 0%, #d0e6ff 50%, #b7c8fe 100%);">

  <div class="container d-flex justify-content-center" style="margin-top: 300px;">
    <form id="actionForm" action="/signup" method="post" class="bg-white p-4 p-md-5 rounded shadow w-100" style="max-width: 450px;">
      <div class="form-group mb-3">
        <label for="email">Email address</label>
        <input type="email" class="form-control" id="email" aria-describedby="emailHelp" placeholder="Enter email" name="email">
        <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
      </div>
      <div class="form-group mb-3">
        <label for="first_name">First name</label>
        <input class="form-control" id="first_name"  placeholder="First name" name="first_name">
      </div>
      <div class="form-group mb-3">
        <label for="first_name">First name</label>
        <input class="form-control" id="first_name"  placeholder="First name" name="first_name">
      </div>
      <div class="form-group mb-3">
        <label for="first_name">First name</label>
        <input class="form-control" id="first_name" placeholder="First name" name="first_name">
      </div>
      <div class="form-group mb-3">
        <label for="password">Password</label>
        <input class="form-control" id="password" name="password">
      </div>
      <div class="form-group mb-3">
        <label for="confirm_password">Confirm Password</label>
        <input class="form-control" id="confirm_password" name="confirm_password">
      </div>
      <div class="form-group mb-3"><span id="passwordError"></span></div>
      <button type="submit" id="SubmitBtn" class="btn btn-primary">Submit</button>
    </form>

  </div>
  
  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <script>
      document.getElementById('actionForm').addEventListener('input', function () {
        validateForm();
      });

        function validateForm() {
          const password = document.getElementById('password');
          const confirm_password = document.getElementById('confirm_password');
          const errorElement = document.getElementById('passwordError');
          const submitBtn = document.getElementById('SubmitBtn');
          let isValid = true;

          if (password !== confirm_password) {
          errorElement.textContent = 'Passwords do not match';
          isValid = false;
          } else {
            errorElemnt.textContent = 'Passwords match';
            isValid = true;
          }
          if (isValid) {
            submitBtn.classList.add('enabled');
            submitBtn.disabled = false;
          } else {
            submitBtn.classList.remove('enabled');
            submitBtn.disabled = true;
          }

        }
        
    </script>
</body>
</html>
